<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Legends of the Game's Supermarket Together Profit Calculator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Legends of the Game's Supermarket Together Profit Calculator</h1>

<div id="controls">
  <div class="control-row">
    <label for="categorySelect">Choose a category:</label>
    <select id="categorySelect">
      <option>(No categories yet)</option>
    </select>
  </div>

  <div class="control-row">
    <span class="control-label">Select Profit Margin:</span>
    <button class="profit-btn" data-profit="20">20%</button>
    <button class="profit-btn" data-profit="30">30%</button>
    <button class="profit-btn" data-profit="40">40%</button>
    <button class="profit-btn" data-profit="50">50%</button>

    <input id="customProfit" type="number" placeholder="Custom %" step="0.1">
  </div>

  <div id="profitWarning" style="display:none;">⚠ Max profit is 99.9%</div>
</div>
<div id="showingStatus"></div>
  <table>
    <thead>
      <tr>
        <th>Image</th>
        <th>Product</th>
        <th>Cost ($)</th>
        <th>Profit (%)</th>
        <th>Sale Price ($)</th>
        <th>Profit ($)</th>
      </tr>
    </thead>
    <tbody id="productTableBody"></tbody>
  </table>

  <script src="js/app.js"></script>
  <div id="floating-box" class="floating-buttons">
  <button id="toggle-btn" class="close-btn">✖</button>
  <div class="buttons-content">
    <a href="https://github.com/LegendsOfTheGame/supermarket-profit-calc/issues/new" target="_blank">🐞 Report a Bug</a>
    <a href="https://store.steampowered.com/app/2709570/Supermarket_Together/?utm_source=profitcalc" target="_blank">🛒 Play on Steam</a>
    <a href="https://github.com/LegendsOfTheGame/supermarket-profit-calc" target="_blank">⭐ Star on GitHub</a>
    <a href="https://ko-fi.com/haven_reborn" target="_blank">☕ Donate on Ko‑Fi</a>
    <a href="https://buymeacoffee.com/hammerstreetclean" target="_blank">🍵 Support on Buy Me a Coffee</a>
  </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const toggleBtn = document.getElementById("toggle-btn");
  const floatingBox = document.getElementById("floating-box");

  toggleBtn.addEventListener("click", () => {
    floatingBox.classList.toggle("minimized");
    // Change button text depending on state
    if (floatingBox.classList.contains("minimized")) {
      toggleBtn.textContent = "➕"; // expand icon
    } else {
      toggleBtn.textContent = "✖"; // close icon
    }
  });
});
</script>
</body>
</html>
